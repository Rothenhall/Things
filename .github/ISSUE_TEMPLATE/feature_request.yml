name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem first, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
  - type: textarea
    id: alternatives
    attributes:
      label: What did you try instead?
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: It works without adding a paid service or a required third-party account (Things stays free to self-host)
        - label: I would be willing to help build it
